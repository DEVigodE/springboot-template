name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27
          cache: maven

      # Compiles, runs unit tests + ArchUnit layer rules, and the
      # Testcontainers-based integration test (Docker is available on
      # ubuntu-latest runners; the test disables itself without Docker).
      - name: Build and test
        run: ./mvnw -B verify

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: spring-auth-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
